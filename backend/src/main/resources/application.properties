# Application Name
spring.application.name=ceyharvest

# ---------------------------------------------------------------------------
# NOTE: every secret below is supplied via environment variables.
# Defaults are local-development only and must never hold real credentials.
# See .env.example for the full list.
# ---------------------------------------------------------------------------

# MongoDB (set MONGODB_URI to your Atlas connection string in every deployment)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ceyharvest_db}
spring.data.mongodb.database=${MONGODB_DATABASE:ceyharvest_db}

# Server - Render (and most PaaS hosts) inject the port to bind on
server.port=${PORT:8080}

# JWT - JWT_SECRET must be at least 32 characters (HS256 key requirement)
jwt.secret=${JWT_SECRET:dev-only-insecure-secret-please-override-me}
jwt.expiration=${JWT_EXPIRATION:86400}

# Security Settings
spring.security.user.name=disabled
spring.security.user.password=disabled

# CORS - comma separated list of allowed frontend origins.
# Values are treated as origin *patterns*, so "https://*.vercel.app" works.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# Development-only endpoints (/api/dev/**, /api/admin/reset/**).
# MUST stay false in any deployed environment - these bypass authentication.
app.dev-endpoints.enabled=${DEV_ENDPOINTS_ENABLED:false}

# Email Configuration (Gmail SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${EMAIL_USERNAME:}
spring.mail.password=${EMAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# SMS Configuration (Disabled due to Twilio restrictions in Sri Lanka)
sms.enabled=${SMS_ENABLED:false}

# Application URLs
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# ML yield-prediction service (Flask). Leave blank to serve predictions from
# the built-in mock model instead of calling an external service.
app.ml.base-url=${ML_API_URL:}

# Stripe Configuration - unset keys put PaymentService into mock mode
stripe.publishable.key=${STRIPE_PUBLISHABLE_KEY:pk_test_default}
stripe.secret.key=${STRIPE_SECRET_KEY:sk_test_default}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}

# Multipart uploads - product images are stored base64 in MongoDB,
# so keep this comfortably under Mongo's 16MB document limit.
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}

# Actuator Settings
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=${HEALTH_DETAILS:never}

# Exclude mail from the health aggregate. spring-boot-starter-mail auto-registers
# a health indicator that opens a real SMTP connection on every probe, so an
# unconfigured (or briefly unreachable) mailbox would report the whole service
# DOWN and fail the platform health check. Email is optional here; the database
# is what determines whether this service can actually serve traffic.
management.health.mail.enabled=false
