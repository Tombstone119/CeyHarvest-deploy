[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

# API calls are relative (/api/...), so they must be proxied to the backend
# before the SPA catch-all below swallows them and returns index.html.
[[redirects]]
  from = "/api/*"
  to = "https://ceyharvest-api-prod.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
